<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Creditos de favicon https://www.flaticon.es/iconos-gratis/entrenar -->
    <link rel="icon" type="image/png" href="/favicon-subte-2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transporte Público de la Ciudad Autónoma de Buenos Aires</title>
    <script>
      (function () {
        try {
          var key = "gcba-transporte-color-theme";
          var stored = localStorage.getItem(key);
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
